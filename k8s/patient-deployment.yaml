apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
      - name: patient-service
        image: patient-service
        imagePullPolicy: Never
        ports:
        - containerPort: 3001


---


apiVersion: v1
kind: Service
metadata:
  name: patient-service
spec:
  selector:
    app: patient-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: NodePort

